<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Particles Prototype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 900px;
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 60px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .prototypes {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 40px;
        }

        .prototype-link {
            display: block;
            padding: 32px 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .prototype-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }

        .prototype-link:hover::before {
            left: 100%;
        }

        .prototype-link:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .prototype-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .prototype-description {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
            font-weight: 300;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 20px; }
            .prototype-link { padding: 24px 28px; }
            .prototype-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Volumetric Particles Prototype</h1>
        <p class="subtitle">Recherche en design computationnel</p>

        <div class="prototypes">
            <a href="dispersed-volume.html" class="prototype-link">
                <div class="prototype-title">Image dispersée</div>
                <div class="prototype-description">
                    Volume perceptif par spatialisation particulaire
                </div>
                <span class="badge">Version 1.0</span>
            </a>

            <a href="faceted-volume.html" class="prototype-link">
                <div class="prototype-title">Image facettée</div>
                <div class="prototype-description">
                    États visuels conditionnés par l'orientation
                </div>
                <span class="badge">Version 2.0</span>
            </a>

            <a href="stratified-volume.html" class="prototype-link">
                <div class="prototype-title">Image stratifiée</div>
                <div class="prototype-description">
                    Lecture volumétrique par profondeur computationnelle
                </div>
                <span class="badge">Version 3.0</span>
            </a>
        </div>
    </div>
</body>
</html>
