<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volumetric Particle System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui { position: fixed; bottom: 20px; right: 20px; z-index: 100;
              background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
              padding: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
              max-width: 240px; }

        #title { position: fixed; top: 20px; left: 20px; z-index: 100;
                 font-size: 11px; font-weight: 500; opacity: 0.5;
                 text-transform: uppercase; letter-spacing: 1.5px; }

        button { display: block; width: 100%; margin: 6px 0; padding: 10px;
                 background: rgba(255,255,255,0.08); color: #fff;
                 border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
                 cursor: pointer; font-size: 11px; font-weight: 600;
                 transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover { background: rgba(255,255,255,0.15); }
        button:active { transform: scale(0.97); }

        .preview { width: 100%; aspect-ratio: 1; border-radius: 6px; margin: 8px 0;
                   display: flex; align-items: center; justify-content: center;
                   background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
                   overflow: hidden; font-size: 10px; opacity: 0.4; }
        .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .preview.loaded { opacity: 1; }

        input[type="file"] { display: none; }

        label { font-size: 9px; font-weight: 600; margin-top: 12px; display: block;
                text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }

        .hidden { display: none !important; }

        #controls { margin-top: 12px; padding-top: 12px;
                    border-top: 1px solid rgba(255,255,255,0.08); }

        .slider { width: 100%; height: 3px; border-radius: 1.5px;
                  background: rgba(255,255,255,0.1); outline: none;
                  -webkit-appearance: none; margin: 6px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                                         width: 12px; height: 12px; border-radius: 50%;
                                         background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%;
                                     background: #fff; cursor: pointer; border: none; }

        .value { font-family: 'Courier New', monospace; float: right; font-weight: 700; font-size: 9px; }

        .hint { font-size: 9px; opacity: 0.3; margin-top: 10px; text-align: center;
                font-style: italic; }
    </style>
</head>
<body>
    <div id="title">Volumetric Particles</div>
    <div id="canvas"></div>

    <div id="ui">
        <div id="load-section">
            <div class="preview" id="preview">Empty</div>
            <button onclick="document.getElementById('file-input').click()">Load Image</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div id="controls" class="hidden">
            <label>Point Size <span class="value" id="val-size">0.020</span></label>
            <input type="range" class="slider" id="size" min="0.01" max="0.1" step="0.001" value="0.02" oninput="document.getElementById('val-size').textContent = parseFloat(this.value).toFixed(3)">

            <label>Depth Spread <span class="value" id="val-depth">1.0x</span></label>
            <input type="range" class="slider" id="depth" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('val-depth').textContent = parseFloat(this.value).toFixed(1) + 'x'">

            <label>Breath Speed <span class="value" id="val-breath">0.5</span></label>
            <input type="range" class="slider" id="breath" min="0" max="2" step="0.1" value="0.5" oninput="document.getElementById('val-breath').textContent = parseFloat(this.value).toFixed(1)">

            <button onclick="applySettings()">Apply</button>
            <button onclick="reset()">Reset</button>
        </div>

        <p class="hint">Drag to rotate • Scroll to zoom</p>
    </div>

    <script src="three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;
        let geometry, material;
        let breathSpeed = 0.5;
        let depthMultiplier = 1.0;
        let pointSize = 0.02;
        let time = 0;
        let currentImage = null;

        // Init Three.js
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.z = 300;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Mouse control
            let isDrag = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.onmousedown = function(e) {
                isDrag = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            renderer.domElement.onmousemove = function(e) {
                if (!isDrag || !particles) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                particles.rotation.y += dx * 0.005;
                particles.rotation.x += dy * 0.005;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            document.onmouseup = function() {
                isDrag = false;
            };

            // Zoom with mouse wheel
            renderer.domElement.addEventListener('wheel', function(e) {
                e.preventDefault();
                const zoomSpeed = 0.1;
                const delta = e.deltaY > 0 ? 1 : -1;
                camera.position.z += delta * zoomSpeed * camera.position.z;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });

            animate();
        }

        // Load image
        document.getElementById('file-input').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    document.getElementById('preview').innerHTML = '<img src="' + ev.target.result + '">';

                    // Reset sliders to default (cube)
                    document.getElementById('size').value = 0.02;
                    document.getElementById('depth').value = 1.0;
                    document.getElementById('breath').value = 0.5;
                    document.getElementById('val-size').textContent = '0.020';
                    document.getElementById('val-depth').textContent = '1.0x';
                    document.getElementById('val-breath').textContent = '0.5';

                    generate(img);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function generate(img) {
            if (typeof THREE === 'undefined') {
                alert('THREE.js not loaded.');
                return;
            }

            // Read parameters from sliders
            pointSize = parseFloat(document.getElementById('size').value);
            depthMultiplier = parseFloat(document.getElementById('depth').value);
            breathSpeed = parseFloat(document.getElementById('breath').value);

            // Crop to square (take smallest dimension)
            const TARGET_SIZE = Math.min(img.width, img.height);
            const canvas = document.createElement('canvas');
            canvas.width = TARGET_SIZE;
            canvas.height = TARGET_SIZE;
            const ctx = canvas.getContext('2d');

            // Crop to center square
            const sourceSize = Math.min(img.width, img.height);
            const offsetX = (img.width - sourceSize) / 2;
            const offsetY = (img.height - sourceSize) / 2;

            // Draw cropped and resized image
            ctx.drawImage(img, offsetX, offsetY, sourceSize, sourceSize, 0, 0, TARGET_SIZE, TARGET_SIZE);

            const imageData = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE);
            const data = imageData.data;

            // Create particle for each pixel (1 pixel = 1 particle)
            const positions = [];
            const colors = [];
            const initialZ = [];

            const scaleFactor = 0.5;
            const halfSize = TARGET_SIZE / 2;

            // TRUE CUBE: depth = width = height = 1000
            const depthSpread = TARGET_SIZE * scaleFactor * depthMultiplier;

            for (let y = 0; y < TARGET_SIZE; y++) {
                for (let x = 0; x < TARGET_SIZE; x++) {
                    const i = (y * TARGET_SIZE + x) * 4;
                    const alpha = data[i + 3];

                    // Only create particle if pixel is visible
                    if (alpha > 30) {
                        // Position
                        const px = (x - halfSize) * scaleFactor;
                        const py = -(y - halfSize) * scaleFactor;
                        const pz = (Math.random() - 0.5) * depthSpread;

                        positions.push(px, py, pz);
                        initialZ.push(pz);

                        // Color directly from pixel
                        colors.push(
                            data[i] / 255,
                            data[i + 1] / 255,
                            data[i + 2] / 255
                        );
                    }
                }
            }

            // Create geometry
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('initialZ', new THREE.Float32BufferAttribute(initialZ, 1));

            // PointsMaterial with vertexColors
            material = new THREE.PointsMaterial({
                size: pointSize,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                sizeAttenuation: false
            });

            if (particles) scene.remove(particles);
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            document.getElementById('load-section').classList.add('hidden');
            document.getElementById('controls').classList.remove('hidden');
        }

        function applySettings() {
            if (!currentImage) {
                alert('No image loaded');
                return;
            }

            // Regenerate with new settings
            generate(currentImage);
        }

        function reset() {
            currentImage = null;
            if (particles) scene.remove(particles);
            document.getElementById('preview').innerHTML = 'Empty';
            document.getElementById('file-input').value = '';
            document.getElementById('load-section').classList.remove('hidden');
            document.getElementById('controls').classList.add('hidden');
        }

        // Animation with subtle breathing movement
        function animate() {
            requestAnimationFrame(animate);

            time += 0.001 * breathSpeed;

            // Subtle breath movement on Z axis
            if (particles && geometry) {
                const positions = geometry.attributes.position.array;
                const initialZs = geometry.attributes.initialZ.array;

                for (let i = 0; i < positions.length / 3; i++) {
                    const idx = i * 3 + 2;
                    // Micro-variation on Z: initial + subtle sine wave
                    const epsilon = 0.3 * breathSpeed;
                    const breathOffset = Math.sin(time + i * 0.01) * epsilon;
                    positions[idx] = initialZs[i] + breathOffset;
                }

                geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // Resize
        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        // Start
        window.onload = init;
    </script>
</body>
</html>
