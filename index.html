<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volumetric Particle System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui { position: fixed; bottom: 20px; right: 20px; z-index: 100;
              background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
              padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
              min-width: 280px; }

        #title { position: fixed; top: 20px; left: 20px; z-index: 100;
                 font-size: 14px; font-weight: 500; opacity: 0.6;
                 text-transform: uppercase; letter-spacing: 2px; }

        button { display: block; width: 100%; margin: 8px 0; padding: 14px;
                 background: rgba(255,255,255,0.1); color: #fff;
                 border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
                 cursor: pointer; font-size: 13px; font-weight: 600;
                 transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
        button:active { transform: scale(0.98); }

        .preview { width: 100%; aspect-ratio: 1; border-radius: 8px; margin: 12px 0;
                   display: flex; align-items: center; justify-content: center;
                   background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
                   overflow: hidden; }
        .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        input[type="file"] { display: none; }

        label { font-size: 11px; font-weight: 600; margin-top: 16px; display: block;
                text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }

        .hidden { display: none !important; }

        #controls { margin-top: 16px; padding-top: 16px;
                    border-top: 1px solid rgba(255,255,255,0.1); }

        .slider { width: 100%; height: 4px; border-radius: 2px;
                  background: rgba(255,255,255,0.1); outline: none;
                  -webkit-appearance: none; margin: 8px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                                         width: 16px; height: 16px; border-radius: 50%;
                                         background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
                                     background: #fff; cursor: pointer; border: none; }

        .value { font-family: 'Courier New', monospace; float: right; font-weight: 700; }

        .hint { font-size: 10px; opacity: 0.4; margin-top: 12px; text-align: center;
                font-style: italic; }
    </style>
</head>
<body>
    <div id="title">Volumetric Particles</div>
    <div id="canvas"></div>

    <div id="ui">
        <div class="preview" id="preview">Empty</div>
        <button onclick="document.getElementById('file-input').click()">Load Image</button>
        <input type="file" id="file-input" accept="image/*">

        <div id="controls" class="hidden">
            <label>Point Size <span class="value" id="val-size">0.02</span></label>
            <input type="range" class="slider" id="size" min="0.01" max="0.1" step="0.001" value="0.02" oninput="updateSize(this.value)">

            <label>Depth Spread <span class="value" id="val-depth">Auto</span></label>
            <input type="range" class="slider" id="depth" min="0.5" max="2" step="0.1" value="1" oninput="updateDepth(this.value)">

            <label>Breath Speed <span class="value" id="val-breath">0.5</span></label>
            <input type="range" class="slider" id="breath" min="0" max="2" step="0.1" value="0.5" oninput="updateBreath(this.value)">

            <button onclick="reset()">Reset</button>
        </div>

        <p class="hint">Drag to rotate • Scroll to zoom</p>
    </div>

    <script src="three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;
        let geometry, material;
        let breathSpeed = 0.5;
        let depthMultiplier = 1.0;
        let time = 0;

        // Init Three.js
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.z = 300;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Mouse control
            let isDrag = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.onmousedown = function(e) {
                isDrag = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            renderer.domElement.onmousemove = function(e) {
                if (!isDrag || !particles) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                particles.rotation.y += dx * 0.005;
                particles.rotation.x += dy * 0.005;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            document.onmouseup = function() {
                isDrag = false;
            };

            // Zoom with mouse wheel
            renderer.domElement.addEventListener('wheel', function(e) {
                e.preventDefault();
                const zoomSpeed = 0.1;
                const delta = e.deltaY > 0 ? 1 : -1;
                camera.position.z += delta * zoomSpeed * camera.position.z;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });

            animate();
        }

        // Load image
        document.getElementById('file-input').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    document.getElementById('preview').innerHTML = '<img src="' + ev.target.result + '">';
                    generate(img);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function generate(img) {
            if (typeof THREE === 'undefined') {
                alert('THREE.js not loaded.');
                return;
            }

            // Extract pixel data
            const canvas = document.createElement('canvas');
            const width = img.width;
            const height = img.height;
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Create particle for each pixel (1 pixel = 1 particle)
            const positions = [];
            const colors = [];
            const initialZ = [];

            const scaleFactor = 0.5;
            const halfW = width / 2;
            const halfH = height / 2;

            // Calculate depth to create a CUBE (not a flat rectangle)
            const maxDim = Math.max(width, height);
            const depthSpread = maxDim * scaleFactor * depthMultiplier;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const alpha = data[i + 3];

                    // Only create particle if pixel is visible
                    if (alpha > 30) {
                        // Position
                        const px = (x - halfW) * scaleFactor;
                        const py = -(y - halfH) * scaleFactor;
                        const pz = (Math.random() - 0.5) * depthSpread;

                        positions.push(px, py, pz);
                        initialZ.push(pz);

                        // Color directly from pixel
                        colors.push(
                            data[i] / 255,
                            data[i + 1] / 255,
                            data[i + 2] / 255
                        );
                    }
                }
            }

            // Create geometry
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('initialZ', new THREE.Float32BufferAttribute(initialZ, 1));

            // PointsMaterial with vertexColors
            material = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                sizeAttenuation: false
            });

            if (particles) scene.remove(particles);
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            document.getElementById('controls').classList.remove('hidden');
        }

        function updateSize(val) {
            document.getElementById('val-size').textContent = parseFloat(val).toFixed(3);
            if (material) material.size = parseFloat(val);
        }

        function updateDepth(val) {
            document.getElementById('val-depth').textContent = parseFloat(val).toFixed(1) + 'x';
            depthMultiplier = parseFloat(val);
        }

        function updateBreath(val) {
            document.getElementById('val-breath').textContent = parseFloat(val).toFixed(1);
            breathSpeed = parseFloat(val);
        }

        function reset() {
            if (particles) scene.remove(particles);
            document.getElementById('preview').innerHTML = 'Empty';
            document.getElementById('file-input').value = '';
            document.getElementById('controls').classList.add('hidden');
        }

        // Animation with subtle breathing movement
        function animate() {
            requestAnimationFrame(animate);

            time += 0.001 * breathSpeed;

            // Subtle breath movement on Z axis
            if (particles && geometry) {
                const positions = geometry.attributes.position.array;
                const initialZs = geometry.attributes.initialZ.array;

                for (let i = 0; i < positions.length / 3; i++) {
                    const idx = i * 3 + 2;
                    // Micro-variation on Z: initial + subtle sine wave
                    const epsilon = 0.3 * breathSpeed;
                    const breathOffset = Math.sin(time + i * 0.01) * epsilon;
                    positions[idx] = initialZs[i] + breathOffset;
                }

                geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // Resize
        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        // Start
        window.onload = init;
    </script>
</body>
</html>
