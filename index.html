<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volumetric Particle System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #fff; color: #000; overflow: hidden; }

        h1 { position: fixed; top: 20px; left: 20px; z-index: 100; font-size: 28px; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui { position: fixed; top: 100px; left: 20px; z-index: 100; background: rgba(255,255,255,0.95);
              padding: 20px; border: 2px solid #000; max-width: 300px; }

        button { display: block; width: 100%; margin: 10px 0; padding: 12px; background: #000; color: #fff;
                 border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .preview { width: 120px; height: 120px; border: 2px solid #000; margin: 10px 0;
                   display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
        .preview img { max-width: 100%; max-height: 100%; }

        input[type="file"] { display: none; }

        label { font-size: 12px; font-weight: bold; margin-top: 10px; display: block; }

        .hidden { display: none !important; }

        #controls { margin-top: 20px; padding-top: 20px; border-top: 2px solid #000; }
        .slider { width: 100%; }
        .value { font-family: monospace; float: right; }
    </style>
</head>
<body>
    <h1>Volumetric Particles</h1>

    <div id="canvas"></div>

    <div id="ui">
        <label>Select Image:</label>
        <div class="preview" id="preview">Empty</div>
        <button onclick="document.getElementById('file-input').click()">LOAD IMAGE</button>
        <input type="file" id="file-input" accept="image/*">

        <div id="controls" class="hidden">
            <label>Point Size: <span class="value" id="val-size">0.02</span></label>
            <input type="range" class="slider" id="size" min="0.01" max="0.1" step="0.001" value="0.02" oninput="updateSize(this.value)">

            <label>Depth Spread: <span class="value" id="val-depth">10</span></label>
            <input type="range" class="slider" id="depth" min="1" max="50" step="1" value="10" oninput="updateDepth(this.value)">

            <label>Breath Speed: <span class="value" id="val-breath">0.5</span></label>
            <input type="range" class="slider" id="breath" min="0" max="2" step="0.1" value="0.5" oninput="updateBreath(this.value)">

            <button onclick="reset()">RESET</button>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;
        let geometry, material;
        let breathSpeed = 0.5;
        let depthSpread = 10;
        let time = 0;

        // Init Three.js
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.z = 300;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Mouse control
            let isDrag = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.onmousedown = function(e) {
                isDrag = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            renderer.domElement.onmousemove = function(e) {
                if (!isDrag || !particles) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                particles.rotation.y += dx * 0.005;
                particles.rotation.x += dy * 0.005;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            document.onmouseup = function() {
                isDrag = false;
            };

            animate();
        }

        // Load image
        document.getElementById('file-input').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    document.getElementById('preview').innerHTML = '<img src="' + ev.target.result + '">';
                    generate(img);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function generate(img) {
            if (typeof THREE === 'undefined') {
                alert('THREE.js not loaded.');
                return;
            }

            // Extract pixel data
            const canvas = document.createElement('canvas');
            const width = img.width;
            const height = img.height;
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Create particle for each pixel (1 pixel = 1 particle)
            const positions = [];
            const colors = [];
            const initialZ = [];

            const scaleFactor = 0.5;
            const halfW = width / 2;
            const halfH = height / 2;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const alpha = data[i + 3];

                    // Only create particle if pixel is visible
                    if (alpha > 30) {
                        // Position
                        const px = (x - halfW) * scaleFactor;
                        const py = -(y - halfH) * scaleFactor;
                        const pz = (Math.random() - 0.5) * depthSpread;

                        positions.push(px, py, pz);
                        initialZ.push(pz);

                        // Color directly from pixel
                        colors.push(
                            data[i] / 255,
                            data[i + 1] / 255,
                            data[i + 2] / 255
                        );
                    }
                }
            }

            // Create geometry
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('initialZ', new THREE.Float32BufferAttribute(initialZ, 1));

            // PointsMaterial with vertexColors
            material = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                sizeAttenuation: false
            });

            if (particles) scene.remove(particles);
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            document.getElementById('controls').classList.remove('hidden');
        }

        function updateSize(val) {
            document.getElementById('val-size').textContent = parseFloat(val).toFixed(3);
            if (material) material.size = parseFloat(val);
        }

        function updateDepth(val) {
            document.getElementById('val-depth').textContent = val;
            depthSpread = parseFloat(val);
        }

        function updateBreath(val) {
            document.getElementById('val-breath').textContent = parseFloat(val).toFixed(1);
            breathSpeed = parseFloat(val);
        }

        function reset() {
            if (particles) scene.remove(particles);
            document.getElementById('preview').innerHTML = 'Empty';
            document.getElementById('file-input').value = '';
            document.getElementById('controls').classList.add('hidden');
        }

        // Animation with subtle breathing movement
        function animate() {
            requestAnimationFrame(animate);

            time += 0.001 * breathSpeed;

            // Subtle breath movement on Z axis
            if (particles && geometry) {
                const positions = geometry.attributes.position.array;
                const initialZs = geometry.attributes.initialZ.array;

                for (let i = 0; i < positions.length / 3; i++) {
                    const idx = i * 3 + 2;
                    // Micro-variation on Z: initial + subtle sine wave
                    const epsilon = 0.3 * breathSpeed;
                    const breathOffset = Math.sin(time + i * 0.01) * epsilon;
                    positions[idx] = initialZs[i] + breathOffset;
                }

                geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // Resize
        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        // Start
        window.onload = init;
    </script>
</body>
</html>
