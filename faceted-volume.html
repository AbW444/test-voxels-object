<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Faceted Volume - Prototype 1.1</title>
    <!-- Version 1.1: Cube Faces Selector -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Cube selector panel - LEFT SIDE */
        #cube-selector-panel { position: fixed; top: 50%; left: 20px; transform: translateY(-50%);
                               z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                               padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                               width: 280px; }

        #cube-selector-panel h3 { font-size: 12px; font-weight: 600; margin-bottom: 16px;
                                   text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;
                                   text-align: center; }

        #reference-cube-container { width: 200px; height: 200px; margin: 0 auto 20px; }

        .face-item { display: flex; align-items: center; gap: 12px; padding: 8px;
                     background: rgba(255,255,255,0.05); border-radius: 6px;
                     margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
                     border: 2px solid transparent; }
        .face-item:hover { background: rgba(255,255,255,0.1); }
        .face-item.selected { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }

        .face-color { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
        .face-label { font-size: 11px; font-weight: 600; flex-grow: 1; }
        .face-preview { width: 32px; height: 32px; border-radius: 4px;
                       background: rgba(255,255,255,0.05); overflow: hidden;
                       display: flex; align-items: center; justify-content: center;
                       font-size: 8px; opacity: 0.5; }
        .face-preview img { width: 100%; height: 100%; object-fit: cover; }
        .face-preview.loaded { opacity: 1; }

        #load-face-btn { display: block; width: 100%; margin: 12px 0; padding: 12px;
                        background: rgba(255,255,255,0.1); color: #fff;
                        border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
                        cursor: pointer; font-size: 11px; font-weight: 600;
                        transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        #load-face-btn:hover { background: rgba(255,255,255,0.2); }
        #load-face-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Controls panel - RIGHT SIDE */
        #controls-panel { position: fixed; bottom: 20px; right: 20px; z-index: 100;
                         background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                         padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                         max-width: 320px; }

        .param-row { margin-bottom: 16px; }
        .param-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .param-header label { font-size: 10px; font-weight: 600; text-transform: uppercase;
                             letter-spacing: 0.8px; opacity: 0.7; }
        .param-value { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; }

        .slider { width: 100%; height: 4px; border-radius: 2px;
                 background: rgba(255,255,255,0.15); outline: none;
                 -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
                                       border-radius: 50%; background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
                                   background: #fff; cursor: pointer; border: none; }

        button { display: block; width: 100%; margin: 8px 0; padding: 10px;
                background: rgba(255,255,255,0.1); color: #fff;
                border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
                cursor: pointer; font-size: 11px; font-weight: 600;
                transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: rgba(255,255,255,0.2); }

        #title-link { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
                     text-decoration: none; color: #fff; text-align: center; }
        #title { font-size: 18px; font-weight: 600; opacity: 0.7;
                text-transform: uppercase; letter-spacing: 2px; }
        #subtitle { font-size: 11px; opacity: 0.5; margin-top: 4px; letter-spacing: 0.5px; }

        /* Version selector */
        #version-selector { position: fixed; bottom: 20px; left: 20px; z-index: 100;
                           background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
                           padding: 8px 12px; border-radius: 6px;
                           border: 1px solid rgba(255,255,255,0.2);
                           font-size: 10px; cursor: pointer; }

        .hidden { display: none !important; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <a href="index.html" id="title-link">
        <div id="title">Volumetric Particles</div>
        <div id="subtitle">Volume à faces — Projection par face de cube</div>
    </a>

    <div id="canvas"></div>

    <!-- Cube Face Selector Panel - LEFT -->
    <div id="cube-selector-panel">
        <h3>⬢ Cube Faces</h3>

        <div id="reference-cube-container"></div>

        <div class="face-item" data-face="px">
            <div class="face-color" style="background: #ff4444;"></div>
            <div class="face-label">Face +X (Right)</div>
            <div class="face-preview" id="preview-px">—</div>
        </div>

        <div class="face-item" data-face="nx">
            <div class="face-color" style="background: #ff8844;"></div>
            <div class="face-label">Face -X (Left)</div>
            <div class="face-preview" id="preview-nx">—</div>
        </div>

        <div class="face-item" data-face="py">
            <div class="face-color" style="background: #44ff44;"></div>
            <div class="face-label">Face +Y (Top)</div>
            <div class="face-preview" id="preview-py">—</div>
        </div>

        <div class="face-item" data-face="ny">
            <div class="face-color" style="background: #44ff88;"></div>
            <div class="face-label">Face -Y (Bottom)</div>
            <div class="face-preview" id="preview-ny">—</div>
        </div>

        <div class="face-item" data-face="pz">
            <div class="face-color" style="background: #4444ff;"></div>
            <div class="face-label">Face +Z (Front)</div>
            <div class="face-preview" id="preview-pz">—</div>
        </div>

        <div class="face-item" data-face="nz">
            <div class="face-color" style="background: #8844ff;"></div>
            <div class="face-label">Face -Z (Back)</div>
            <div class="face-preview" id="preview-nz">—</div>
        </div>

        <button id="load-face-btn" disabled>Load Image for Face</button>
        <input type="file" id="face-image-input" accept="image/*">

        <button id="generate-btn" disabled>Generate Volume</button>
        <button id="clear-all-btn">Clear All Faces</button>
    </div>

    <!-- Controls Panel - RIGHT -->
    <div id="controls-panel" class="hidden">
        <div class="param-row">
            <div class="param-header">
                <label>Cube Size</label>
                <span class="param-value" id="val-cubeSize">2.0</span>
            </div>
            <input type="range" class="slider" id="cubeSize" min="0.5" max="5.0" step="0.1" value="2.0">
        </div>

        <div class="param-row">
            <div class="param-header">
                <label>Density</label>
                <span class="param-value" id="val-density">10X</span>
            </div>
            <input type="range" class="slider" id="density" min="1" max="20" step="1" value="10">
        </div>

        <div class="param-row">
            <div class="param-header">
                <label>Volume Depth</label>
                <span class="param-value" id="val-depth">1.0X</span>
            </div>
            <input type="range" class="slider" id="depth" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <button onclick="applySettings()">Apply</button>
        <button onclick="resetCamera()">Reset Camera</button>
    </div>

    <!-- Version Selector -->
    <div id="version-selector">
        <span>v<span id="current-version">1.1</span></span>
    </div>

    <script src="three.min.js"></script>
    <script>
        // === GLOBAL STATE ===
        const VERSION = "1.1";

        let scene, camera, renderer;
        let mainScene, referenceScene;
        let particleVolume, referenceCube;

        let cubeSize = 2.0;
        let density = 10;
        let volumeDepth = 1.0;

        let selectedFace = null;
        let faceImages = {
            px: null, nx: null,
            py: null, ny: null,
            pz: null, nz: null
        };
        let faceTextures = {
            px: null, nx: null,
            py: null, ny: null,
            pz: null, nz: null
        };

        // === THREE.JS SETUP ===
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            // Main scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(150, 100, 200);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.autoClear = false;
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-1, -1, -0.5);
            scene.add(dirLight2);

            // Reference cube scene (for UI)
            initReferenceCube();

            // Mouse controls
            setupMouseControls();

            // UI event listeners
            setupUIListeners();

            animate();
        }

        // === REFERENCE CUBE (in UI panel) ===
        function initReferenceCube() {
            referenceScene = new THREE.Scene();
            referenceScene.background = new THREE.Color(0x1a1a1a);

            const refCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
            refCamera.position.set(3, 2, 3);
            refCamera.lookAt(0, 0, 0);

            const refRenderer = new THREE.WebGLRenderer({ antialias: true });
            refRenderer.setSize(200, 200);
            document.getElementById('reference-cube-container').appendChild(refRenderer.domElement);

            // Create reference cube with colored faces
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const materials = [
                new THREE.MeshBasicMaterial({ color: 0xff4444 }), // +X (right) - red
                new THREE.MeshBasicMaterial({ color: 0xff8844 }), // -X (left) - orange
                new THREE.MeshBasicMaterial({ color: 0x44ff44 }), // +Y (top) - green
                new THREE.MeshBasicMaterial({ color: 0x44ff88 }), // -Y (bottom) - light green
                new THREE.MeshBasicMaterial({ color: 0x4444ff }), // +Z (front) - blue
                new THREE.MeshBasicMaterial({ color: 0x8844ff })  // -Z (back) - purple
            ];

            referenceCube = new THREE.Mesh(geometry, materials);
            referenceScene.add(referenceCube);

            // Add edges
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.3, transparent: true });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            referenceCube.add(wireframe);

            // Animate reference cube
            function animateRef() {
                requestAnimationFrame(animateRef);
                referenceCube.rotation.y += 0.005;
                referenceCube.rotation.x += 0.002;
                refRenderer.render(referenceScene, refCamera);
            }
            animateRef();

            // Make reference cube clickable for face selection
            refRenderer.domElement.style.cursor = 'pointer';
            refRenderer.domElement.addEventListener('click', () => {
                // For now, faces are selected via the list
                // Could add raycasting here for direct cube clicking
            });
        }

        // === UI LISTENERS ===
        function setupUIListeners() {
            // Face item selection
            document.querySelectorAll('.face-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.face-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedFace = this.dataset.face;
                    document.getElementById('load-face-btn').disabled = false;
                });
            });

            // Load image for selected face
            document.getElementById('load-face-btn').addEventListener('click', () => {
                if (selectedFace) {
                    document.getElementById('face-image-input').click();
                }
            });

            document.getElementById('face-image-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/') && selectedFace) {
                    loadImageForFace(file, selectedFace);
                }
            });

            // Generate volume button
            document.getElementById('generate-btn').addEventListener('click', generateVolume);

            // Clear all faces
            document.getElementById('clear-all-btn').addEventListener('click', () => {
                if (confirm('Clear all face images?')) {
                    Object.keys(faceImages).forEach(face => {
                        faceImages[face] = null;
                        if (faceTextures[face]) {
                            faceTextures[face].dispose();
                            faceTextures[face] = null;
                        }
                        const preview = document.getElementById('preview-' + face);
                        preview.innerHTML = '—';
                        preview.classList.remove('loaded');
                    });
                    document.getElementById('generate-btn').disabled = true;
                    if (particleVolume) {
                        scene.remove(particleVolume);
                        particleVolume = null;
                    }
                }
            });

            // Sliders
            setupSliders();
        }

        function setupSliders() {
            const sliders = ['cubeSize', 'density', 'depth'];
            sliders.forEach(id => {
                const slider = document.getElementById(id);
                const valueSpan = document.getElementById('val-' + id);

                slider.addEventListener('input', () => {
                    let value = parseFloat(slider.value);
                    if (id === 'density') {
                        valueSpan.textContent = Math.round(value) + 'X';
                    } else {
                        valueSpan.textContent = value.toFixed(1);
                        if (id === 'depth') valueSpan.textContent += 'X';
                    }
                });
            });
        }

        // === LOAD IMAGE FOR FACE ===
        function loadImageForFace(file, face) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    faceImages[face] = img;

                    // Create texture
                    const canvas = document.createElement('canvas');
                    const size = Math.min(img.width, img.height);
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const offsetX = (img.width - size) / 2;
                    const offsetY = (img.height - size) / 2;
                    ctx.drawImage(img, offsetX, offsetY, size, size, 0, 0, size, size);

                    if (faceTextures[face]) faceTextures[face].dispose();
                    faceTextures[face] = new THREE.CanvasTexture(canvas);
                    faceTextures[face].minFilter = THREE.LinearFilter;
                    faceTextures[face].magFilter = THREE.LinearFilter;

                    // Update preview
                    const preview = document.getElementById('preview-' + face);
                    preview.innerHTML = '<img src="' + ev.target.result + '">';
                    preview.classList.add('loaded');

                    // Enable generate button if at least one face has image
                    const hasAnyImage = Object.values(faceImages).some(img => img !== null);
                    document.getElementById('generate-btn').disabled = !hasAnyImage;

                    document.getElementById('controls-panel').classList.remove('hidden');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // === GENERATE VOLUME ===
        function generateVolume() {
            // Remove previous volume
            if (particleVolume) {
                scene.remove(particleVolume);
                if (particleVolume.geometry) particleVolume.geometry.dispose();
                if (particleVolume.material) particleVolume.material.dispose();
            }

            // Read parameters
            cubeSize = parseFloat(document.getElementById('cubeSize').value);
            density = parseInt(document.getElementById('density').value);
            volumeDepth = parseFloat(document.getElementById('depth').value);

            // Determine grid resolution based on density
            const TARGET_SIZE = 512;
            const step = Math.max(1, Math.floor(20 / density));

            // Process all face images and extract pixel data
            const facePixelData = {};

            Object.entries(faceImages).forEach(([face, img]) => {
                if (!img) return;

                const canvas = document.createElement('canvas');
                canvas.width = TARGET_SIZE;
                canvas.height = TARGET_SIZE;
                const ctx = canvas.getContext('2d');

                const sourceSize = Math.min(img.width, img.height);
                const offsetX = (img.width - sourceSize) / 2;
                const offsetY = (img.height - sourceSize) / 2;
                ctx.drawImage(img, offsetX, offsetY, sourceSize, sourceSize, 0, 0, TARGET_SIZE, TARGET_SIZE);

                facePixelData[face] = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE).data;
            });

            // Collect unique pixel positions from all faces
            const pixelSet = new Set();
            Object.entries(facePixelData).forEach(([face, data]) => {
                for (let y = 0; y < TARGET_SIZE; y += step) {
                    for (let x = 0; x < TARGET_SIZE; x += step) {
                        const i = (y * TARGET_SIZE + x) * 4;
                        const alpha = data[i + 3];
                        if (alpha > 30) {
                            pixelSet.add(`${x},${y}`);
                        }
                    }
                }
            });

            // Build particle data with per-face colors
            const positions = [];
            const colorsPX = [], colorsNX = [];
            const colorsPY = [], colorsNY = [];
            const colorsPZ = [], colorsNZ = [];

            const scaleFactor = 0.5;
            const halfSize = TARGET_SIZE / 2;
            const depthSpread = TARGET_SIZE * scaleFactor * volumeDepth;

            Array.from(pixelSet).forEach(key => {
                const [x, y] = key.split(',').map(Number);

                // Position
                const px = (x - halfSize) * scaleFactor;
                const py = -(y - halfSize) * scaleFactor;
                const pz = (Math.random() - 0.5) * depthSpread;
                positions.push(px, py, pz);

                // Extract pixel color for each face
                const i = (y * TARGET_SIZE + x) * 4;

                // Helper to get color or default gray
                const getColor = (face) => {
                    const data = facePixelData[face];
                    if (data && data[i + 3] > 30) {
                        return [data[i] / 255, data[i+1] / 255, data[i+2] / 255];
                    }
                    return [0.2, 0.2, 0.2]; // default gray
                };

                const cPX = getColor('px'); colorsPX.push(...cPX);
                const cNX = getColor('nx'); colorsNX.push(...cNX);
                const cPY = getColor('py'); colorsPY.push(...cPY);
                const cNY = getColor('ny'); colorsNY.push(...cNY);
                const cPZ = getColor('pz'); colorsPZ.push(...cPZ);
                const cNZ = getColor('nz'); colorsNZ.push(...cNZ);
            });

            const count = positions.length / 3;

            // Create custom geometry with per-face color attributes
            const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);

            // Custom shader to handle per-instance face colors
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    attribute vec3 colorPX;
                    attribute vec3 colorNX;
                    attribute vec3 colorPY;
                    attribute vec3 colorNY;
                    attribute vec3 colorPZ;
                    attribute vec3 colorNZ;

                    varying vec3 vColor;
                    varying vec3 vNormal;
                    varying vec3 vWorldNormal;

                    void main() {
                        // Use LOCAL normal to determine face (unaffected by rotation)
                        // This ensures face-to-color mapping stays consistent
                        vec3 localNormal = normal;

                        // Determine which face based on LOCAL normal
                        vec3 absNormal = abs(localNormal);
                        if (absNormal.x > absNormal.y && absNormal.x > absNormal.z) {
                            // X face
                            vColor = localNormal.x > 0.0 ? colorPX : colorNX;
                        } else if (absNormal.y > absNormal.x && absNormal.y > absNormal.z) {
                            // Y face
                            vColor = localNormal.y > 0.0 ? colorPY : colorNY;
                        } else {
                            // Z face
                            vColor = localNormal.z > 0.0 ? colorPZ : colorNZ;
                        }

                        // Transform normal to world space for lighting only
                        vWorldNormal = normalize((modelMatrix * instanceMatrix * vec4(normal, 0.0)).xyz);

                        gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying vec3 vWorldNormal;

                    void main() {
                        // Simple lighting using world-space normal
                        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                        float diffuse = max(dot(vWorldNormal, lightDir), 0.3);

                        gl_FragColor = vec4(vColor * diffuse, 1.0);
                    }
                `
            });

            particleVolume = new THREE.InstancedMesh(geometry, material, count);
            particleVolume.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

            // Set per-instance face colors
            geometry.setAttribute('colorPX', new THREE.InstancedBufferAttribute(new Float32Array(colorsPX), 3));
            geometry.setAttribute('colorNX', new THREE.InstancedBufferAttribute(new Float32Array(colorsNX), 3));
            geometry.setAttribute('colorPY', new THREE.InstancedBufferAttribute(new Float32Array(colorsPY), 3));
            geometry.setAttribute('colorNY', new THREE.InstancedBufferAttribute(new Float32Array(colorsNY), 3));
            geometry.setAttribute('colorPZ', new THREE.InstancedBufferAttribute(new Float32Array(colorsPZ), 3));
            geometry.setAttribute('colorNZ', new THREE.InstancedBufferAttribute(new Float32Array(colorsNZ), 3));

            // Set instance positions
            const matrix = new THREE.Matrix4();
            for (let i = 0; i < count; i++) {
                matrix.setPosition(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                particleVolume.setMatrixAt(i, matrix);
            }

            particleVolume.instanceMatrix.needsUpdate = true;
            scene.add(particleVolume);
        }

        // === MOUSE CONTROLS ===
        function setupMouseControls() {
            let isDrag = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.onmousedown = function(e) {
                isDrag = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            renderer.domElement.onmousemove = function(e) {
                if (!isDrag || !particleVolume) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                particleVolume.rotation.y += dx * 0.005;
                particleVolume.rotation.x += dy * 0.005;
                prevMouse = { x: e.clientX, y: e.clientY };
            };

            document.onmouseup = function() {
                isDrag = false;
            };

            renderer.domElement.addEventListener('wheel', function(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 1 : -1;
                camera.position.z += delta * 0.1 * camera.position.z;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });
        }

        function applySettings() {
            if (!Object.values(faceImages).some(img => img !== null)) {
                alert('Please load at least one face image');
                return;
            }
            generateVolume();
        }

        function resetCamera() {
            camera.position.set(150, 100, 200);
            camera.lookAt(0, 0, 0);
            if (particleVolume) {
                particleVolume.rotation.set(0, 0, 0);
            }
        }

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            renderer.clear();
            renderer.render(scene, camera);
        }

        // === RESIZE ===
        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        // === START ===
        window.onload = init;
    </script>
</body>
</html>
