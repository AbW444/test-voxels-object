<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Faceted Volume - Prototype 1.1</title>
    <!-- Version 1.1: 6-face projection with pixel-cube particles -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Title */
        #title-link { position: fixed; top: 20px; left: 20px; z-index: 100;
                     text-decoration: none; color: #fff; transition: opacity 0.2s; }
        #title-link:hover { opacity: 1 !important; }
        #title { font-size: 18px; font-weight: 600; opacity: 0.7;
                text-transform: uppercase; letter-spacing: 2px; }
        #subtitle { font-size: 11px; opacity: 0.5; margin-top: 4px; letter-spacing: 0.5px; }

        /* Face Selector Panel - LEFT */
        #face-panel { position: fixed; top: 100px; left: 20px; z-index: 50;
                     background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                     padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                     width: 280px; max-height: calc(100vh - 140px); overflow-y: auto; }

        #face-panel h3 { font-size: 12px; font-weight: 600; margin-bottom: 16px;
                        text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;
                        text-align: center; }

        .face-item { display: flex; align-items: center; gap: 12px; padding: 8px;
                    background: rgba(255,255,255,0.05); border-radius: 6px;
                    margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
                    border: 2px solid transparent; }
        .face-item:hover { background: rgba(255,255,255,0.1); }
        .face-item.selected { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }

        .face-color { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
        .face-label { font-size: 11px; font-weight: 600; flex-grow: 1; }
        .face-preview { width: 32px; height: 32px; border-radius: 4px;
                       background: rgba(255,255,255,0.05); overflow: hidden;
                       display: flex; align-items: center; justify-content: center;
                       font-size: 8px; opacity: 0.5; }
        .face-preview img { width: 100%; height: 100%; object-fit: cover; }
        .face-preview.loaded { opacity: 1; }

        button { display: block; width: 100%; margin: 12px 0; padding: 12px;
                background: rgba(255,255,255,0.1); color: #fff;
                border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
                cursor: pointer; font-size: 11px; font-weight: 600;
                transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: rgba(255,255,255,0.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Controls Panel - RIGHT */
        #controls { position: fixed; bottom: 20px; right: 20px; z-index: 50;
                   background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                   padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                   width: 320px; display: none; }
        #controls.visible { display: block; }

        .param-row { margin-bottom: 16px; }
        .param-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .param-header label { font-size: 10px; font-weight: 600; text-transform: uppercase;
                             letter-spacing: 0.8px; opacity: 0.7; }
        .param-value { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; }

        .slider { width: 100%; height: 4px; border-radius: 2px;
                 background: rgba(255,255,255,0.15); outline: none;
                 -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
                                       border-radius: 50%; background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
                                   background: #fff; cursor: pointer; border: none; }

        input[type="file"] { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="index.html" id="title-link">
        <div id="title">Volumetric Particles</div>
        <div id="subtitle">Volume à faces — Projection frontale</div>
    </a>

    <div id="canvas"></div>

    <!-- Face Selector Panel -->
    <div id="face-panel">
        <h3>⬢ Cube Faces</h3>

        <div class="face-item" data-face="px">
            <div class="face-color" style="background: #ff4444;"></div>
            <div class="face-label">Face +X (Right)</div>
            <div class="face-preview" id="preview-px">—</div>
        </div>

        <div class="face-item" data-face="nx">
            <div class="face-color" style="background: #ff8844;"></div>
            <div class="face-label">Face -X (Left)</div>
            <div class="face-preview" id="preview-nx">—</div>
        </div>

        <div class="face-item" data-face="py">
            <div class="face-color" style="background: #44ff44;"></div>
            <div class="face-label">Face +Y (Top)</div>
            <div class="face-preview" id="preview-py">—</div>
        </div>

        <div class="face-item" data-face="ny">
            <div class="face-color" style="background: #44ff88;"></div>
            <div class="face-label">Face -Y (Bottom)</div>
            <div class="face-preview" id="preview-ny">—</div>
        </div>

        <div class="face-item" data-face="pz">
            <div class="face-color" style="background: #4444ff;"></div>
            <div class="face-label">Face +Z (Front)</div>
            <div class="face-preview" id="preview-pz">—</div>
        </div>

        <div class="face-item" data-face="nz">
            <div class="face-color" style="background: #8844ff;"></div>
            <div class="face-label">Face -Z (Back)</div>
            <div class="face-preview" id="preview-nz">—</div>
        </div>

        <button id="load-btn" disabled>Load Image for Face</button>
        <input type="file" id="file-input" accept="image/*">

        <button id="generate-btn" disabled>Generate Volume</button>
        <button id="clear-btn">Clear All</button>
    </div>

    <!-- Controls Panel -->
    <div id="controls">
        <div class="param-row">
            <div class="param-header">
                <label>Cube Size</label>
                <span class="param-value" id="val-size">0.8</span>
            </div>
            <input type="range" class="slider" id="size" min="0.1" max="2.0" step="0.1" value="0.8">
        </div>

        <div class="param-row">
            <div class="param-header">
                <label>Density</label>
                <span class="param-value" id="val-density">10X</span>
            </div>
            <input type="range" class="slider" id="density" min="1" max="20" step="1" value="10">
        </div>

        <button onclick="applySettings()">Apply Settings</button>
        <button onclick="resetCamera()">Reset Camera</button>
    </div>

    <script src="three.min.js"></script>
    <script>
        // === GLOBAL STATE ===
        let scene, camera, renderer, particleVolume;
        let selectedFace = null;
        let faceImages = {
            px: null, nx: null,
            py: null, ny: null,
            pz: null, nz: null
        };

        let cubeSize = 0.8;
        let density = 10;

        // Face rotations for frontale orientation
        const FACE_ROTATIONS = {
            'pz': { axis: 'y', angle: 0 },           // Front: no rotation
            'nz': { axis: 'y', angle: Math.PI },     // Back: 180° on Y
            'px': { axis: 'y', angle: -Math.PI/2 },  // Right: -90° on Y
            'nx': { axis: 'y', angle: Math.PI/2 },   // Left: +90° on Y
            'py': { axis: 'x', angle: -Math.PI/2 },  // Top: -90° on X
            'ny': { axis: 'x', angle: Math.PI/2 }    // Bottom: +90° on X
        };

        // === INIT ===
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(150, 100, 200);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-1, -1, -0.5);
            scene.add(dirLight2);

            // Mouse controls
            setupMouseControls();

            // UI listeners
            setupUI();

            animate();
        }

        // === UI SETUP ===
        function setupUI() {
            // Face selection
            document.querySelectorAll('.face-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.face-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedFace = this.dataset.face;
                    document.getElementById('load-btn').disabled = false;
                });
            });

            // Load image button
            document.getElementById('load-btn').addEventListener('click', () => {
                if (selectedFace) {
                    document.getElementById('file-input').click();
                }
            });

            // File input
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/') && selectedFace) {
                    loadImageForFace(file, selectedFace);
                }
            });

            // Generate button
            document.getElementById('generate-btn').addEventListener('click', generateVolume);

            // Clear button
            document.getElementById('clear-btn').addEventListener('click', () => {
                if (confirm('Clear all face images?')) {
                    Object.keys(faceImages).forEach(face => {
                        faceImages[face] = null;
                        const preview = document.getElementById('preview-' + face);
                        preview.innerHTML = '—';
                        preview.classList.remove('loaded');
                    });
                    document.getElementById('generate-btn').disabled = true;
                    if (particleVolume) {
                        scene.remove(particleVolume);
                        particleVolume = null;
                    }
                }
            });

            // Sliders
            document.getElementById('size').addEventListener('input', (e) => {
                document.getElementById('val-size').textContent = parseFloat(e.target.value).toFixed(1);
            });
            document.getElementById('density').addEventListener('input', (e) => {
                document.getElementById('val-density').textContent = Math.round(e.target.value) + 'X';
            });
        }

        // === LOAD IMAGE ===
        function loadImageForFace(file, face) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    faceImages[face] = img;

                    // Update preview
                    const preview = document.getElementById('preview-' + face);
                    preview.innerHTML = '<img src="' + ev.target.result + '">';
                    preview.classList.add('loaded');

                    // Enable generate button
                    const hasAnyImage = Object.values(faceImages).some(img => img !== null);
                    document.getElementById('generate-btn').disabled = !hasAnyImage;

                    // Show controls
                    document.getElementById('controls').classList.add('visible');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // === GENERATE VOLUME ===
        function generateVolume() {
            // Remove previous volume
            if (particleVolume) {
                scene.remove(particleVolume);
                if (particleVolume.geometry) particleVolume.geometry.dispose();
                if (particleVolume.material) particleVolume.material.dispose();
            }

            // Read parameters
            cubeSize = parseFloat(document.getElementById('size').value);
            density = parseInt(document.getElementById('density').value);

            const TARGET_SIZE = 512;
            const step = Math.max(1, Math.floor(20 / density));
            const scaleFactor = 0.5;
            const halfSize = TARGET_SIZE / 2;
            const layerOffset = halfSize * scaleFactor * 0.5;

            // Process each face image
            const allParticles = [];

            Object.entries(faceImages).forEach(([face, img]) => {
                if (!img) return;

                // Extract pixels from image
                const canvas = document.createElement('canvas');
                canvas.width = TARGET_SIZE;
                canvas.height = TARGET_SIZE;
                const ctx = canvas.getContext('2d');
                const sourceSize = Math.min(img.width, img.height);
                const offsetX = (img.width - sourceSize) / 2;
                const offsetY = (img.height - sourceSize) / 2;
                ctx.drawImage(img, offsetX, offsetY, sourceSize, sourceSize, 0, 0, TARGET_SIZE, TARGET_SIZE);
                const data = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE).data;

                const rotation = FACE_ROTATIONS[face];

                // Create particles (1 pixel = 1 cube)
                for (let v = 0; v < TARGET_SIZE; v += step) {
                    for (let u = 0; u < TARGET_SIZE; u += step) {
                        const i = (v * TARGET_SIZE + u) * 4;
                        const alpha = data[i + 3];

                        if (alpha > 30) {
                            const r = data[i] / 255;
                            const g = data[i + 1] / 255;
                            const b = data[i + 2] / 255;

                            // Base position in UV plane
                            const pu = (u - halfSize) * scaleFactor;
                            const pv = -(v - halfSize) * scaleFactor;

                            // Position based on face
                            let pos;
                            if (face === 'pz') {
                                pos = [pu, pv, layerOffset];
                            } else if (face === 'nz') {
                                pos = [pu, pv, -layerOffset];
                            } else if (face === 'px') {
                                pos = [layerOffset, pv, pu];
                            } else if (face === 'nx') {
                                pos = [-layerOffset, pv, pu];
                            } else if (face === 'py') {
                                pos = [pu, layerOffset, pv];
                            } else if (face === 'ny') {
                                pos = [pu, -layerOffset, pv];
                            }

                            allParticles.push({
                                position: pos,
                                color: [r, g, b],
                                rotation: rotation
                            });
                        }
                    }
                }
            });

            // Create InstancedMesh with cubes
            const count = allParticles.length;
            const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                metalness: 0.1,
                roughness: 0.8
            });

            particleVolume = new THREE.InstancedMesh(geometry, material, count);

            const colors = new Float32Array(count * 3);
            const matrix = new THREE.Matrix4();
            const rotation = new THREE.Euler();

            for (let i = 0; i < count; i++) {
                const particle = allParticles[i];

                // Set color
                colors[i * 3] = particle.color[0];
                colors[i * 3 + 1] = particle.color[1];
                colors[i * 3 + 2] = particle.color[2];

                // Apply rotation for frontale orientation
                rotation.set(0, 0, 0);
                if (particle.rotation.axis === 'x') {
                    rotation.x = particle.rotation.angle;
                } else if (particle.rotation.axis === 'y') {
                    rotation.y = particle.rotation.angle;
                }

                matrix.makeRotationFromEuler(rotation);
                matrix.setPosition(particle.position[0], particle.position[1], particle.position[2]);

                particleVolume.setMatrixAt(i, matrix);
            }

            geometry.setAttribute('color', new THREE.InstancedBufferAttribute(colors, 3));
            particleVolume.instanceMatrix.needsUpdate = true;
            scene.add(particleVolume);

            console.log(`Generated ${count} particles from ${Object.values(faceImages).filter(Boolean).length} faces`);
        }

        // === MOUSE CONTROLS ===
        function setupMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging && particleVolume) {
                    const deltaMove = {
                        x: e.offsetX - previousMousePosition.x,
                        y: e.offsetY - previousMousePosition.y
                    };

                    particleVolume.rotation.y += deltaMove.x * 0.005;
                    particleVolume.rotation.x += deltaMove.y * 0.005;
                }

                previousMousePosition = {
                    x: e.offsetX,
                    y: e.offsetY
                };
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });

            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.1;
                camera.position.z += e.deltaY * zoomSpeed;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });
        }

        // === UTILITY FUNCTIONS ===
        function applySettings() {
            if (Object.values(faceImages).some(img => img !== null)) {
                generateVolume();
            }
        }

        function resetCamera() {
            camera.position.set(150, 100, 200);
            camera.lookAt(0, 0, 0);
            if (particleVolume) {
                particleVolume.rotation.set(0, 0, 0);
            }
        }

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // === RESIZE ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        init();
    </script>
</body>
</html>
