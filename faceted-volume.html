<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Faceted Volume - Pixel Cube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #title-link { position: fixed; top: 20px; left: 20px; z-index: 100;
                     text-decoration: none; color: #fff; transition: opacity 0.2s; }
        #title-link:hover { opacity: 1 !important; }
        #title { font-size: 18px; font-weight: 600; opacity: 0.7;
                text-transform: uppercase; letter-spacing: 2px; }
        #subtitle { font-size: 11px; opacity: 0.5; margin-top: 4px; letter-spacing: 0.5px; }

        /* Face Selector Panel - LEFT */
        #face-panel { position: fixed; top: 100px; left: 20px; z-index: 50;
                     background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                     padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                     width: 280px; max-height: calc(100vh - 140px); overflow-y: auto; }

        #face-panel h3 { font-size: 12px; font-weight: 600; margin-bottom: 16px;
                        text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;
                        text-align: center; }

        .face-item { display: flex; align-items: center; gap: 12px; padding: 8px;
                    background: rgba(255,255,255,0.05); border-radius: 6px;
                    margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
                    border: 2px solid transparent; }
        .face-item:hover { background: rgba(255,255,255,0.1); }
        .face-item.selected { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }

        .face-color { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
        .face-label { font-size: 11px; font-weight: 600; flex-grow: 1; }
        .face-preview { width: 32px; height: 32px; border-radius: 4px;
                       background: rgba(255,255,255,0.05); overflow: hidden;
                       display: flex; align-items: center; justify-content: center;
                       font-size: 8px; opacity: 0.5; }
        .face-preview img { width: 100%; height: 100%; object-fit: cover; }
        .face-preview.loaded { opacity: 1; }

        button { display: block; width: 100%; margin: 12px 0; padding: 12px;
                background: rgba(255,255,255,0.1); color: #fff;
                border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
                cursor: pointer; font-size: 11px; font-weight: 600;
                transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: rgba(255,255,255,0.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Controls Panel - RIGHT */
        #controls { position: fixed; bottom: 20px; right: 20px; z-index: 50;
                   background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
                   padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
                   width: 320px; display: none; }
        #controls.visible { display: block; }

        .param-row { margin-bottom: 16px; }
        .param-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .param-header label { font-size: 10px; font-weight: 600; text-transform: uppercase;
                             letter-spacing: 0.8px; opacity: 0.7; }
        .param-value { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; }

        .slider { width: 100%; height: 4px; border-radius: 2px;
                 background: rgba(255,255,255,0.15); outline: none;
                 -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
                                       border-radius: 50%; background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
                                   background: #fff; cursor: pointer; border: none; }

        input[type="file"] { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="index.html" id="title-link">
        <div id="title">Volumetric Particles</div>
        <div id="subtitle">6 Faces — Pixel Cubes</div>
    </a>

    <div id="canvas"></div>

    <!-- Face Selector Panel -->
    <div id="face-panel">
        <h3>⬢ Cube Faces</h3>

        <div class="face-item" data-face="px">
            <div class="face-color" style="background: #ff4444;"></div>
            <div class="face-label">Face +X (Right)</div>
            <div class="face-preview" id="preview-px">—</div>
        </div>

        <div class="face-item" data-face="nx">
            <div class="face-color" style="background: #ff8844;"></div>
            <div class="face-label">Face -X (Left)</div>
            <div class="face-preview" id="preview-nx">—</div>
        </div>

        <div class="face-item" data-face="py">
            <div class="face-color" style="background: #44ff44;"></div>
            <div class="face-label">Face +Y (Top)</div>
            <div class="face-preview" id="preview-py">—</div>
        </div>

        <div class="face-item" data-face="ny">
            <div class="face-color" style="background: #44ff88;"></div>
            <div class="face-label">Face -Y (Bottom)</div>
            <div class="face-preview" id="preview-ny">—</div>
        </div>

        <div class="face-item" data-face="pz">
            <div class="face-color" style="background: #4444ff;"></div>
            <div class="face-label">Face +Z (Front)</div>
            <div class="face-preview" id="preview-pz">—</div>
        </div>

        <div class="face-item" data-face="nz">
            <div class="face-color" style="background: #8844ff;"></div>
            <div class="face-label">Face -Z (Back)</div>
            <div class="face-preview" id="preview-nz">—</div>
        </div>

        <button id="load-btn" disabled>Load Image for Face</button>
        <input type="file" id="file-input" accept="image/*">

        <button id="generate-btn" disabled>Generate Volume</button>
        <button id="clear-btn">Clear All</button>
    </div>

    <!-- Controls Panel -->
    <div id="controls">
        <div class="param-row">
            <div class="param-header">
                <label>Cube Size</label>
                <span class="param-value" id="val-size">1.0</span>
            </div>
            <input type="range" class="slider" id="size" min="0.5" max="3" step="0.1" value="1.0">
        </div>

        <div class="param-row">
            <div class="param-header">
                <label>Density</label>
                <span class="param-value" id="val-density">7X</span>
            </div>
            <input type="range" class="slider" id="density" min="1" max="15" step="1" value="7">
        </div>

        <div class="param-row">
            <div class="param-header">
                <label>Depth</label>
                <span class="param-value" id="val-depth">1.0X</span>
            </div>
            <input type="range" class="slider" id="depth" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <button onclick="applySettings()">Apply Settings</button>
        <button onclick="resetCamera()">Reset Camera</button>
    </div>

    <script src="three.min.js"></script>
    <script>
        // === GLOBAL STATE ===
        let scene, camera, renderer, particleVolume;
        let selectedFace = null;
        let faceImages = {
            px: null, nx: null,
            py: null, ny: null,
            pz: null, nz: null
        };

        let cubeSize = 1.0;
        let density = 7;
        let depthMultiplier = 1.0;

        // === INIT ===
        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 0, 300);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight1.position.set(1, 1, 1);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight2.position.set(-1, -1, -0.5);
            scene.add(dirLight2);

            setupMouseControls();
            setupUI();

            animate();
        }

        // === UI SETUP ===
        function setupUI() {
            // Face selection
            document.querySelectorAll('.face-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.face-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedFace = this.dataset.face;
                    document.getElementById('load-btn').disabled = false;
                });
            });

            // Load image button
            document.getElementById('load-btn').addEventListener('click', () => {
                if (selectedFace) {
                    document.getElementById('file-input').click();
                }
            });

            // File input
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/') && selectedFace) {
                    loadImageForFace(file, selectedFace);
                }
            });

            // Generate button
            document.getElementById('generate-btn').addEventListener('click', generateVolume);

            // Clear button
            document.getElementById('clear-btn').addEventListener('click', () => {
                if (confirm('Clear all face images?')) {
                    Object.keys(faceImages).forEach(face => {
                        faceImages[face] = null;
                        const preview = document.getElementById('preview-' + face);
                        preview.innerHTML = '—';
                        preview.classList.remove('loaded');
                    });
                    document.getElementById('generate-btn').disabled = true;
                    if (particleVolume) {
                        scene.remove(particleVolume);
                        particleVolume = null;
                    }
                    document.getElementById('controls').classList.remove('visible');
                }
            });

            // Sliders
            ['size', 'density', 'depth'].forEach(id => {
                const slider = document.getElementById(id);
                slider.addEventListener('input', () => {
                    const value = parseFloat(slider.value);
                    const display = document.getElementById('val-' + id);
                    if (id === 'density') {
                        display.textContent = Math.round(value) + 'X';
                    } else {
                        display.textContent = value.toFixed(1) + (id === 'depth' ? 'X' : '');
                    }
                });
            });
        }

        // === LOAD IMAGE FOR FACE ===
        function loadImageForFace(file, face) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    faceImages[face] = img;

                    // Update preview
                    const preview = document.getElementById('preview-' + face);
                    preview.innerHTML = '<img src="' + ev.target.result + '">';
                    preview.classList.add('loaded');

                    // Enable generate button
                    const hasAnyImage = Object.values(faceImages).some(img => img !== null);
                    document.getElementById('generate-btn').disabled = !hasAnyImage;

                    // Show controls
                    document.getElementById('controls').classList.add('visible');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // === GENERATE VOLUME ===
        function generateVolume() {
            // Remove previous volume
            if (particleVolume) {
                scene.remove(particleVolume);
                if (particleVolume.geometry) particleVolume.geometry.dispose();
                if (particleVolume.material) particleVolume.material.dispose();
            }

            // Read parameters
            cubeSize = parseFloat(document.getElementById('size').value);
            density = parseInt(document.getElementById('density').value);
            depthMultiplier = parseFloat(document.getElementById('depth').value);

            const TARGET_SIZE = 512;
            const step = Math.max(1, Math.floor(10 / density));
            const scaleFactor = 0.5;
            const halfSize = TARGET_SIZE / 2;
            const depthSpread = TARGET_SIZE * scaleFactor * depthMultiplier;

            // Extract pixel data for all faces
            const facePixelData = {};
            Object.entries(faceImages).forEach(([face, img]) => {
                if (img) {
                    const canvas = document.createElement('canvas');
                    canvas.width = TARGET_SIZE;
                    canvas.height = TARGET_SIZE;
                    const ctx = canvas.getContext('2d');
                    const sourceSize = Math.min(img.width, img.height);
                    const offsetX = (img.width - sourceSize) / 2;
                    const offsetY = (img.height - sourceSize) / 2;
                    ctx.drawImage(img, offsetX, offsetY, sourceSize, sourceSize, 0, 0, TARGET_SIZE, TARGET_SIZE);
                    facePixelData[face] = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE).data;
                }
            });

            // Generate pixel cubes for each loaded face with proper orientation
            const allPixelCubes = [];  // Each entry: {position, rotation, faceType, pixelColor}

            // Face transformations to orient each projection correctly
            const faceTransforms = {
                'pz': { axis: 'z', rotX: 0, rotY: 0 },           // Front: no rotation
                'nz': { axis: 'z', rotX: 0, rotY: Math.PI },     // Back: 180° Y
                'px': { axis: 'x', rotX: 0, rotY: Math.PI / 2 }, // Right: 90° Y
                'nx': { axis: 'x', rotX: 0, rotY: -Math.PI / 2 },// Left: -90° Y
                'py': { axis: 'y', rotX: -Math.PI / 2, rotY: 0 },// Top: -90° X
                'ny': { axis: 'y', rotX: Math.PI / 2, rotY: 0 }  // Bottom: 90° X
            };

            const faceOrder = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];
            const faceColorMap = { 'px': 0, 'nx': 1, 'py': 2, 'ny': 3, 'pz': 4, 'nz': 5 };

            // Generate cubes for each loaded face
            Object.entries(facePixelData).forEach(([faceName, data]) => {
                const transform = faceTransforms[faceName];

                for (let v = 0; v < TARGET_SIZE; v += step) {
                    for (let u = 0; u < TARGET_SIZE; u += step) {
                        const i = (v * TARGET_SIZE + u) * 4;
                        const alpha = data[i + 3];

                        if (alpha > 30) {
                            // Base grid position (in 2D)
                            const pu = (u - halfSize) * scaleFactor;
                            const pv = -(v - halfSize) * scaleFactor;
                            const depth = (Math.random() - 0.5) * depthSpread;

                            // Transform position based on face orientation
                            let px, py, pz;
                            if (transform.axis === 'z') {
                                // +Z/-Z faces: XY grid, vary Z
                                px = pu;
                                py = pv;
                                pz = depth;
                            } else if (transform.axis === 'x') {
                                // +X/-X faces: YZ grid, vary X
                                px = depth;
                                py = pv;
                                pz = pu;
                            } else if (transform.axis === 'y') {
                                // +Y/-Y faces: XZ grid, vary Y
                                px = pu;
                                py = depth;
                                pz = pv;
                            }

                            // Pixel color for this face
                            const pixelColor = {
                                r: data[i] / 255,
                                g: data[i + 1] / 255,
                                b: data[i + 2] / 255
                            };

                            allPixelCubes.push({
                                position: { x: px, y: py, z: pz },
                                rotation: { x: transform.rotX, y: transform.rotY },
                                faceType: faceName,
                                faceIndex: faceColorMap[faceName],
                                pixelColor: pixelColor
                            });
                        }
                    }
                }
            });

            // Create geometry with face index attribute
            const geometry = new THREE.BoxGeometry(cubeSize * 3, cubeSize * 3, cubeSize * 3);

            // Add faceIndex attribute to identify which face each vertex belongs to
            const positions = geometry.attributes.position;
            const faceIndices = new Float32Array(positions.count);

            // BoxGeometry has 24 vertices (4 per face), 6 faces
            // Face order: +X, -X, +Y, -Y, +Z, -Z
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 4; j++) {
                    faceIndices[i * 4 + j] = i;
                }
            }

            geometry.setAttribute('faceIndex', new THREE.BufferAttribute(faceIndices, 1));

            // Create instanced attributes for pixel color and active face
            const count = allPixelCubes.length;
            const pixelColors = new Float32Array(count * 3);
            const activeFaces = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const cube = allPixelCubes[i];

                // Store pixel color
                pixelColors[i * 3] = cube.pixelColor.r;
                pixelColors[i * 3 + 1] = cube.pixelColor.g;
                pixelColors[i * 3 + 2] = cube.pixelColor.b;

                // Store which face should display this color
                activeFaces[i] = cube.faceIndex;
            }

            geometry.setAttribute('pixelColor', new THREE.InstancedBufferAttribute(pixelColors, 3));
            geometry.setAttribute('activeFace', new THREE.InstancedBufferAttribute(activeFaces, 1));

            // Custom shader material
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    attribute float faceIndex;
                    attribute vec3 pixelColor;
                    attribute float activeFace;

                    varying vec3 vColor;
                    varying vec3 vNormal;

                    void main() {
                        vNormal = normalize(normalMatrix * normal);

                        // Display pixel color only on active face, dark on others
                        int currentFace = int(faceIndex);
                        int activeFaceIdx = int(activeFace);

                        if (currentFace == activeFaceIdx) {
                            vColor = pixelColor;
                        } else {
                            vColor = vec3(0.05, 0.05, 0.05);  // Dark for non-active faces
                        }

                        vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying vec3 vNormal;

                    void main() {
                        // Simple lighting
                        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                        float diff = max(dot(vNormal, lightDir), 0.0);
                        vec3 ambient = vec3(0.6);
                        vec3 lighting = ambient + diff * 0.4;

                        gl_FragColor = vec4(vColor * lighting, 1.0);
                    }
                `
            });

            // Create InstancedMesh
            particleVolume = new THREE.InstancedMesh(geometry, material, count);

            const matrix = new THREE.Matrix4();
            const quaternion = new THREE.Quaternion();
            const position = new THREE.Vector3();
            const scale = new THREE.Vector3(1, 1, 1);

            for (let i = 0; i < count; i++) {
                const cube = allPixelCubes[i];

                // Set position
                position.set(cube.position.x, cube.position.y, cube.position.z);

                // Set rotation
                quaternion.setFromEuler(new THREE.Euler(cube.rotation.x, cube.rotation.y, 0, 'XYZ'));

                // Compose matrix
                matrix.compose(position, quaternion, scale);
                particleVolume.setMatrixAt(i, matrix);
            }

            particleVolume.instanceMatrix.needsUpdate = true;
            scene.add(particleVolume);

            console.log(`Generated ${count} pixel cubes from ${Object.keys(facePixelData).length} faces`);
        }

        // === MOUSE CONTROLS ===
        function setupMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', () => {
                isDragging = true;
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging && particleVolume) {
                    const deltaMove = {
                        x: e.offsetX - previousMousePosition.x,
                        y: e.offsetY - previousMousePosition.y
                    };
                    particleVolume.rotation.y += deltaMove.x * 0.005;
                    particleVolume.rotation.x += deltaMove.y * 0.005;
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });

            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.1;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });
        }

        // === UTILITY FUNCTIONS ===
        function applySettings() {
            if (Object.values(faceImages).some(img => img !== null)) {
                generateVolume();
            }
        }

        function resetCamera() {
            camera.position.set(0, 0, 300);
            camera.lookAt(0, 0, 0);
            if (particleVolume) {
                particleVolume.rotation.set(0, 0, 0);
            }
        }

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // === RESIZE ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        init();
    </script>
</body>
</html>
