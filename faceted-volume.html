<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Faceted Volume - Cube Pixels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #000; color: #fff; overflow: hidden; }

        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #title-link { position: fixed; top: 20px; left: 20px; z-index: 100;
                     text-decoration: none; color: #fff; transition: opacity 0.2s; }
        #title-link:hover { opacity: 1 !important; }
        #title { font-size: 18px; font-weight: 600; opacity: 0.7;
                text-transform: uppercase; letter-spacing: 2px; }
        #subtitle { font-size: 11px; opacity: 0.5; margin-top: 4px; letter-spacing: 0.5px; }

        #ui { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
              z-index: 100; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
              padding: 32px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
              max-width: 500px; width: 90%; transition: all 0.4s ease; }

        #ui.loaded { top: auto; bottom: 20px; left: auto; right: 20px;
                     transform: none; max-width: 360px; width: auto; padding: 24px; }

        button { display: block; width: 100%; margin: 8px 0; padding: 14px;
                background: rgba(255,255,255,0.1); color: #fff;
                border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
                cursor: pointer; font-size: 12px; font-weight: 600;
                transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: rgba(255,255,255,0.2); }

        .preview { width: 100%; aspect-ratio: 1; border-radius: 6px; margin: 8px 0;
                   display: flex; align-items: center; justify-content: center;
                   background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
                   overflow: hidden; font-size: 10px; opacity: 0.4; }
        .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .preview.loaded { opacity: 1; }

        input[type="file"] { display: none; }
        label { font-size: 11px; font-weight: 600; margin-top: 16px; display: block;
                text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.7; }

        .hidden { display: none !important; }

        #controls { margin-top: 16px; padding-top: 16px;
                    border-top: 1px solid rgba(255,255,255,0.15); }

        .param-row { margin-bottom: 20px; }
        .param-header { display: flex; justify-content: space-between; align-items: center;
                        margin-bottom: 8px; }
        .param-header label { margin: 0; }
        .param-value { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; }

        .slider { width: 100%; height: 4px; border-radius: 2px;
                  background: rgba(255,255,255,0.15); outline: none;
                  -webkit-appearance: none; margin: 10px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
                                         border-radius: 50%; background: #fff; cursor: pointer; }
        .slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
                                     background: #fff; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <a href="index.html" id="title-link">
        <div id="title">Volumetric Particles</div>
        <div id="subtitle">Cube Pixels — Dispersed Volume</div>
    </a>

    <div id="canvas"></div>

    <div id="ui">
        <div id="load-section">
            <label>Load Image</label>
            <div class="preview" id="preview">Drop or Click</div>
            <button onclick="document.getElementById('file-input').click()">Choose Image</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div id="controls" class="hidden">
            <div class="param-row">
                <div class="param-header">
                    <label>Cube Size</label>
                    <span class="param-value" id="val-size">1.0</span>
                </div>
                <input type="range" class="slider" id="size" min="0.5" max="3" step="0.1" value="1.0">
            </div>

            <div class="param-row">
                <div class="param-header">
                    <label>Density</label>
                    <span class="param-value" id="val-density">7X</span>
                </div>
                <input type="range" class="slider" id="density" min="1" max="15" step="1" value="7">
            </div>

            <div class="param-row">
                <div class="param-header">
                    <label>Depth</label>
                    <span class="param-value" id="val-depth">1.0X</span>
                </div>
                <input type="range" class="slider" id="depth" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <button onclick="applySettings()">Apply</button>
            <button onclick="resetCamera()">Reset Camera</button>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;
        let pointSize = 1.0;
        let particleDensity = 7;
        let depthMultiplier = 1.0;
        let currentImage = null;

        function init() {
            if (typeof THREE === 'undefined') {
                alert('THREE.js failed to load.');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 0, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas').appendChild(renderer.domElement);

            // Lighting for 3D cubes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-1, -1, -0.5);
            scene.add(dirLight2);

            setupControls();
            setupFileInput();

            animate();
        }

        function setupControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', () => {
                isDragging = true;
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging && particles) {
                    const deltaMove = {
                        x: e.offsetX - previousMousePosition.x,
                        y: e.offsetY - previousMousePosition.y
                    };
                    particles.rotation.y += deltaMove.x * 0.005;
                    particles.rotation.x += deltaMove.y * 0.005;
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });

            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.1;
                camera.position.z = Math.max(50, Math.min(1000, camera.position.z));
            });

            // Sliders
            ['size', 'density', 'depth'].forEach(id => {
                const slider = document.getElementById(id);
                slider.addEventListener('input', () => {
                    updateValueDisplay(id);
                });
            });
        }

        function updateValueDisplay(param) {
            const value = parseFloat(document.getElementById(param).value);
            const display = document.getElementById('val-' + param);
            if (param === 'density') {
                display.textContent = Math.round(value) + 'X';
            } else {
                display.textContent = value.toFixed(1) + (param === 'depth' ? 'X' : '');
            }
        }

        function setupFileInput() {
            const fileInput = document.getElementById('file-input');
            const preview = document.getElementById('preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    loadImage(file);
                }
            });

            preview.addEventListener('click', () => {
                fileInput.click();
            });

            // Drag and drop
            preview.addEventListener('dragover', (e) => {
                e.preventDefault();
                preview.style.borderColor = 'rgba(255,255,255,0.5)';
            });

            preview.addEventListener('dragleave', () => {
                preview.style.borderColor = 'rgba(255,255,255,0.1)';
            });

            preview.addEventListener('drop', (e) => {
                e.preventDefault();
                preview.style.borderColor = 'rgba(255,255,255,0.1)';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    loadImage(file);
                }
            });
        }

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('preview').innerHTML = '<img src="' + e.target.result + '">';
                    document.getElementById('preview').classList.add('loaded');
                    document.getElementById('ui').classList.add('loaded');
                    document.getElementById('controls').classList.remove('hidden');
                    generate(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function generate(img) {
            // Remove previous particles
            if (particles) {
                scene.remove(particles);
                if (particles.geometry) particles.geometry.dispose();
                if (particles.material) particles.material.dispose();
            }

            // Read parameters
            pointSize = parseFloat(document.getElementById('size').value);
            particleDensity = parseInt(document.getElementById('density').value);
            depthMultiplier = parseFloat(document.getElementById('depth').value);

            const TARGET_SIZE = 512;
            const step = Math.max(1, Math.floor(10 / particleDensity));
            const canvas = document.createElement('canvas');
            canvas.width = TARGET_SIZE;
            canvas.height = TARGET_SIZE;
            const ctx = canvas.getContext('2d');

            // Center crop to square
            const sourceSize = Math.min(img.width, img.height);
            const offsetX = (img.width - sourceSize) / 2;
            const offsetY = (img.height - sourceSize) / 2;
            ctx.drawImage(img, offsetX, offsetY, sourceSize, sourceSize, 0, 0, TARGET_SIZE, TARGET_SIZE);

            const imageData = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE);
            const data = imageData.data;

            // Create particles (1 pixel = 1 cube)
            const positions = [];
            const colors = [];

            const scaleFactor = 0.5;
            const halfSize = TARGET_SIZE / 2;
            const depthSpread = TARGET_SIZE * scaleFactor * depthMultiplier;

            for (let y = 0; y < TARGET_SIZE; y += step) {
                for (let x = 0; x < TARGET_SIZE; x += step) {
                    const i = (y * TARGET_SIZE + x) * 4;
                    const alpha = data[i + 3];

                    if (alpha > 30) {
                        const px = (x - halfSize) * scaleFactor;
                        const py = -(y - halfSize) * scaleFactor;
                        const pz = (Math.random() - 0.5) * depthSpread;

                        positions.push(px, py, pz);

                        colors.push(
                            data[i] / 255,
                            data[i + 1] / 255,
                            data[i + 2] / 255
                        );
                    }
                }
            }

            // Create InstancedMesh with cubes
            const count = positions.length / 3;
            const size = pointSize * 3;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({
                flatShading: true,
                roughness: 0.7,
                metalness: 0.3
            });

            particles = new THREE.InstancedMesh(geometry, material, count);

            const matrix = new THREE.Matrix4();
            const color = new THREE.Color();

            for (let i = 0; i < count; i++) {
                matrix.setPosition(
                    positions[i * 3],
                    positions[i * 3 + 1],
                    positions[i * 3 + 2]
                );
                particles.setMatrixAt(i, matrix);
                color.setRGB(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);
                particles.setColorAt(i, color);
            }

            particles.instanceMatrix.needsUpdate = true;
            scene.add(particles);

            console.log(`Generated ${count} cube particles`);
        }

        function applySettings() {
            if (currentImage) {
                generate(currentImage);
            }
        }

        function resetCamera() {
            camera.position.set(0, 0, 300);
            if (particles) {
                particles.rotation.set(0, 0, 0);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
